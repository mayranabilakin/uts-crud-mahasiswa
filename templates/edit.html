
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mahasiswa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Edit Mahasiswa</h1>
        <p>Ubah informasi mahasiswa, lalu simpan perubahan.</p>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('edit', nim=m['nim']) }}" method="POST">
            <label for="nim">NIM</label>
            <input type="number" id="nim" name="nim"
                   value="{{ m['nim'] }}" required>

            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama"
                   value="{{ m['nama'] }}" required>

            <label for="program_studi">Program Studi</label>
            <input type="text" id="program_studi"
                   name="program_studi"
                   value="{{ m['program_studi'] }}" required>

            <label for="angkatan">Angkatan</label>
            <input type="number" id="angkatan" name="angkatan"
                   value="{{ m['angkatan'] }}" required>

            <label for="ipk">IPK (0,00–4,00)</label>
            <input type="number" id="ipk" name="ipk"
                   min="0" max="4" step="0.01"
                   value="{{ m['ipk'] }}" required>

            <button type="submit">Simpan Perubahan</button>
            <a class="btn-cancel" href="{{ url_for('home') }}">
                Batal
            </a>
        </form>
    </div>
</body>
</html>
